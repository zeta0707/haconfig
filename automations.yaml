- id: '1791636064135'
  alias: 안방 BILRESA 휠 리모컨
  description: 그룹1=조명(클릭 메인등 토글, 길게 간접등 토글, 회전 전체 켜기/끄기), 그룹2=실링팬(회전 속도, 클릭 켜기/끄기),
    그룹3=에어컨(회전 온도, 클릭 켜기/끄기)
  triggers:
  - entity_id: event.anbang_wheel_button_beoteun_1
    id: g1_cw
    trigger: state
  - entity_id: event.anbang_wheel_button_beoteun_2
    id: g1_ccw
    trigger: state
  - entity_id: event.anbang_wheel_button_beoteun_3
    id: g1_press
    trigger: state
  - entity_id: event.anbang_wheel_button_beoteun_4
    id: g2_cw
    trigger: state
  - entity_id: event.anbang_wheel_button_beoteun_5
    id: g2_ccw
    trigger: state
  - entity_id: event.anbang_wheel_button_beoteun_6
    id: g2_press
    trigger: state
  - entity_id: event.anbang_wheel_button_beoteun_7
    id: g3_cw
    trigger: state
  - entity_id: event.anbang_wheel_button_beoteun_8
    id: g3_ccw
    trigger: state
  - entity_id: event.anbang_wheel_button_beoteun_9
    id: g3_press
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not
      in [''unknown'',''unavailable''] and trigger.from_state is not none and trigger.from_state.state
      != ''unavailable'' }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: g1_cw
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.anbang_zemiswitch_jomyeong_1
          - light.anbang_zemiswitch_jomyeong_2
    - conditions:
      - condition: trigger
        id: g1_ccw
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.anbang_zemiswitch_jomyeong_1
          - light.anbang_zemiswitch_jomyeong_2
    - conditions:
      - condition: trigger
        id: g1_press
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ev == ''multi_press_1'' }}'
          sequence:
          - action: light.toggle
            target:
              entity_id: light.anbang_zemiswitch_jomyeong_1
        - conditions:
          - condition: template
            value_template: '{{ ev == ''long_press'' }}'
          sequence:
          - action: light.toggle
            target:
              entity_id: light.anbang_zemiswitch_jomyeong_2
    - conditions:
      - condition: trigger
        id: g2_cw
      sequence:
      - else:
        - action: fan.increase_speed
          data:
            percentage_step: '{{ (n * 100 / 6) | round(0) }}'
          target:
            entity_id: fan.anbang_silringpaen
        if:
        - condition: state
          entity_id: fan.anbang_silringpaen
          state: 'off'
        then:
        - action: light.turn_on
          target:
            entity_id: light.anbang_zemiswitch_silringpaen_switch
    - conditions:
      - condition: trigger
        id: g2_ccw
      sequence:
      - if:
        - condition: state
          entity_id: fan.anbang_silringpaen
          state: 'on'
        - condition: template
          value_template: '{{ (state_attr(''fan.anbang_silringpaen'',''percentage'')
            | int(0)) > 20 }}'
        then:
        - action: fan.decrease_speed
          data:
            percentage_step: '{{ (n * 100 / 6) | round(0) }}'
          target:
            entity_id: fan.anbang_silringpaen
    - conditions:
      - condition: trigger
        id: g2_press
      sequence:
      - if:
        - condition: template
          value_template: '{{ ev == ''multi_press_1'' }}'
        then:
        - action: light.toggle
          target:
            entity_id: light.anbang_zemiswitch_silringpaen_switch
    - conditions:
      - condition: trigger
        id: g3_cw
      sequence:
      - if:
        - condition: template
          value_template: '{{ not is_state(''climate.anbang_eeokeon'',''off'') }}'
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ [ (state_attr(''climate.anbang_eeokeon'',''temperature'')
              | float(24)) + n, 30 ] | min }}'
          target:
            entity_id: climate.anbang_eeokeon
    - conditions:
      - condition: trigger
        id: g3_ccw
      sequence:
      - if:
        - condition: template
          value_template: '{{ not is_state(''climate.anbang_eeokeon'',''off'') }}'
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ [ (state_attr(''climate.anbang_eeokeon'',''temperature'')
              | float(24)) - n, 16 ] | max }}'
          target:
            entity_id: climate.anbang_eeokeon
    - conditions:
      - condition: trigger
        id: g3_press
      sequence:
      - if:
        - condition: template
          value_template: '{{ ev == ''multi_press_1'' }}'
        then:
        - action: light.toggle
          target:
            entity_id: light.anbang_zemiswitch_eeokeon_switch
  max: 10
  mode: queued
  variables:
    ev: '{{ trigger.to_state.attributes.event_type | default('''') }}'
    n: '{{ [ (trigger.to_state.attributes.totalNumberOfPressesCounted | default(1)
      | int(1)), 1 ] | max }}'
- id: '1791637925589'
  alias: 거실 BILRESA 듀얼 버튼 리모컨
  description: 버튼1(PowerOn)=켜기, 버튼2(PowerOff)=끄기. 클릭=메인등, 더블클릭=실링팬, 길게 누르기=에어컨
  triggers:
  - entity_id: event.bilresa_dual_button_dancu_1
    id: 'on'
    trigger: state
  - entity_id: event.bilresa_dual_button_dancu_2
    id: 'off'
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not
      in [''unknown'',''unavailable''] and trigger.from_state is not none and trigger.from_state.state
      != ''unavailable'' }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ev == ''multi_press_1'' }}'
      sequence:
      - action: light.{{ svc }}
        target:
          entity_id: light.geosil_zemiswitch_jomyeong_3
    - conditions:
      - condition: template
        value_template: '{{ ev == ''multi_press_2'' }}'
      sequence:
      - action: light.{{ svc }}
        target:
          entity_id: light.geosil_silringpaen_switch
    - conditions:
      - condition: template
        value_template: '{{ ev == ''long_press'' }}'
      sequence:
      - action: light.{{ svc }}
        target:
          entity_id: light.geosil_eeokeon_switch
  max: 5
  mode: queued
  variables:
    ev: '{{ trigger.to_state.attributes.event_type | default('''') }}'
    svc: '{{ ''turn_on'' if trigger.id == ''on'' else ''turn_off'' }}'
