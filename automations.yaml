- id: '1787300001'
  alias: 가상 청소기 - 청소 중 배터리 소모
  description: ''
  triggers:
  - trigger: time_pattern
    seconds: /10
  conditions:
  - condition: state
    entity_id: input_select.virtual_vacuum_state
    state: cleaning
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.virtual_vacuum_battery
    data:
      value: '{{ [states(''input_number.virtual_vacuum_battery'')|int(0) - 1, 0] |
        max }}'
  - if:
    - condition: numeric_state
      entity_id: input_number.virtual_vacuum_battery
      below: 15
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.virtual_vacuum_state
      data:
        option: returning
  mode: single
- id: '1787300002'
  alias: 가상 청소기 - 복귀 후 도킹 완료
  description: ''
  triggers:
  - trigger: state
    entity_id: input_select.virtual_vacuum_state
    to: returning
  conditions: []
  actions:
  - delay: 00:00:15
  - action: input_select.select_option
    target:
      entity_id: input_select.virtual_vacuum_state
    data:
      option: docked
  mode: single
