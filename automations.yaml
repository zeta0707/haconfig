- id: '1780190128685'
  alias: 누수 감지 알림
  description: ''
  triggers:
  - entity_id: binary_sensor.cafe_water_leak
    id: cafe
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.gongbubang_waterleak_sensor
    id: gongbubang
    to: 'on'
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: cafe
      sequence:
      - action: notify.mobile_app_galaxypad
        data:
          message: "cafe에서 누수가 감지됐습니다! \U0001F4A7"
          title: ⚠️ 누수 경고!
          data:
            ttl: 0
            priority: high
            importance: high
            channel: alarm_stream
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: gongbubang
      sequence:
      - action: notify.mobile_app_galaxypad
        data:
          message: "공부방에서 누수가 감지됐습니다! \U0001F4A7"
          title: ⚠️ 누수 경고!
          data:
            ttl: 0
            priority: high
            importance: high
            channel: alarm_stream
        continue_on_error: true
  mode: parallel
