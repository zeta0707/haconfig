                    - font-size: 20px
                    - font-weight: 700
                    - color: black
                    - justify-self: start
                    - padding-bottom: 10px
                  custom_fields:
                    body:
                      - justify-self: start
                      - width: 100%
                custom_fields:
                  body: |
                    [[[
                      const low = Object.values(states)
                        .filter(e => e.entity_id.startsWith('binary_sensor.') &&
                                     e.attributes.device_class === 'battery' &&
                                     e.state === 'on');
                      if (low.length === 0) {
                        return `<div style="display:flex;align-items:center;gap:8px;color:#00C853;font-size:15px;font-weight:600;">
                                  <ha-icon icon="mdi:check-circle" style="--mdc-icon-size:20px;"></ha-icon>
                                  모든 센서 정상
                                </div>`;
                      }
                      const rows = low.map(e => `
                        <div style="display:flex;align-items:center;gap:8px;color:#F97316;font-size:15px;font-weight:600;padding:4px 0;">
                          <ha-icon icon="mdi:battery-alert" style="--mdc-icon-size:20px;"></ha-icon>
                          ${e.attributes.friendly_name}
                        </div>`).join('');
                      return `<div>${rows}</div>`;
                    ]]]
                grid_options:
                  columns: 12
                  rows: auto
              - type: custom:button-card
                name: 배터리 레벨
                show_state: false
                show_icon: false
                template: []
                styles:
                  grid:
                    - grid-template-areas: '"n" "body"'
                    - grid-template-rows: min-content min-content
                    - justify-items: start
                  card:
                    - padding: 20px
                    - background-color: var(--gray100)
                    - box-shadow: '8px 8px 16px var(--gray300), -8px -8px 16px #ffffff'
                    - border: 1px solid rgba(255,255,255,0.1)
                    - text-align: left
                  name:
                    - font-size: 20px
                    - font-weight: 700
                    - color: black
                    - justify-self: start
                    - padding-bottom: 10px
                  custom_fields:
                    body:
                      - justify-self: start
                      - width: 100%
                custom_fields:
                  body: |
                    [[[
                      const excluded = ['sensor.sm_s942n_battery_level'];
                      const list = Object.values(states)
                        .filter(e => e.entity_id.startsWith('sensor.') &&
                                     e.attributes.device_class === 'battery' &&
                                     !excluded.includes(e.entity_id))
                        .sort((a, b) => (parseFloat(a.state) || 0) - (parseFloat(b.state) || 0));

                      if (list.length === 0) {
                        return `<div style="color:#888;font-size:15px;">등록된 배터리 센서 없음</div>`;
                      }

                      const rows = list.map(e => {
                        const val = parseFloat(e.state) || 0;
                        const color = val < 30 ? '#F97316' : (val < 70 ? '#2F80ED' : '#00C853');
                        return `
                          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06);">
                            <div style="display:flex;align-items:center;gap:10px;">
                              <ha-icon icon="mdi:battery" style="--mdc-icon-size:22px;color:${color};"></ha-icon>
                              <span style="font-size:15px;color:black;">${e.attributes.friendly_name}</span>
                            </div>
                            <span style="font-size:16px;font-weight:700;color:${color};">${val.toFixed(0)}%</span>
                          </div>`;
                      }).join('');

                      return `<div style="width:100%;">${rows}</div>`;
                    ]]]
                grid_options:
                  columns: 12
                  rows: auto
