decluttering_templates:
  light_slider:
    card:
      type: custom:button-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      tap_action:
        action: toggle
        haptic: medium
      show_state: false
      styles:
        grid:
          - grid-template-columns: 40px 1fr
          - grid-template-areas: '"i n"'
        card:
          - padding: 10px 14px
          - height: 50px
          - border-radius: 12px
          - background: white
          - border: 1.5px solid black
          - transition: background 0.2s ease
        img_cell:
          - width: 32px
          - height: 32px
          - border-radius: 50%
          - background: rgba(0, 0, 0, 0.05)
        icon:
          - width: 18px
          - color: black
        name:
          - justify-self: start
          - font-size: 14px
          - font-weight: 600
          - color: black
      state:
        - value: 'on'
          styles:
            card:
              - background: var(--active-small)
            icon:
              - color: var(--orange)
  room_temp_card:
    card:
      type: custom:button-card
      styles:
        grid:
          - grid-template-areas: '"temp"'
        card:
          - padding: 14px 20px
          - height: 110px
          - box-shadow: '8px 8px 16px var(--gray300), -8px -8px 16px #ffffff'
          - border: 1px solid rgba(255,255,255,0.1)
        custom_fields:
          graph:
            - position: absolute
            - width: 100%
            - left: '0'
            - bottom: '0'
            - pointer-events: none
          temp:
            - justify-self: start
            - text-align: left
            - font-size: 44px
            - color: black
            - line-height: 44px
            - font-weight: 500
            - padding: 0
          status:
            - position: absolute
            - top: 14px
            - right: 20px
            - display: flex
            - gap: 12px
            - z-index: 2
      custom_fields:
        temp: |
          [[[
            const t = parseFloat(states['[[temp_entity]]']?.state) || 0;
            const h = parseFloat(states['[[humidity_entity]]']?.state) || 0;
            return `${t.toFixed(1)}° <span style="font-size: 0.4em;">${h.toFixed(1)}%</span>`;
          ]]]
        graph:
          card:
            type: custom:mini-graph-card
            entities:
              - entity: '[[temp_entity]]'
            line_width: 0.2
            height: 60
            show:
              icon: false
              name: false
              state: false
              legend: false
              labels: false
              fill: true
            fill: 0.6
            color_thresholds_transition: hard
            color: '#2F80ED'
            color_thresholds:
              - value: 19
                color: '#2F80ED'
              - value: 20
                color: '#00C853'
              - value: 30
                color: '#FF4D4F'
            card_mod:
              style: |
                ha-card {
                  border-style: none;
                  background: none;
                }
        status:
          card:
            type: horizontal-stack
            cards:
              - type: custom:button-card
                icon: mdi:fire
                entity: boilerEntity
                show_name: false
                show_state: false
                tap_action:
                  action: toggle
                styles:
                  card:
                    - background: none
                    - box-shadow: none
                    - width: 32px
                    - height: 32px
                    - padding: '0'
                card_mod:
                  style: |
                    @keyframes heater-pulse {
                      0%, 100% { transform: scale(1); }
                      50% { transform: scale(1.40); }
                    }
                    ha-icon, ha-state-icon, .icon {
                      --mdc-icon-size: 32px !important;
                      width: 32px !important;
                      height: 32px !important;
                      color: {{ '#FF7043' if is_state('[[boiler_entity]]', 'on') else 'var(--gray300)' }} !important;
                      animation: {{ 'heater-pulse 2s ease-in-out infinite' if is_state('[[boiler_entity]]', 'on') else 'none' }} !important;
                      display: inline-block !important;
                      transform-origin: center;
                    }
              - type: custom:button-card
                icon: mdi:snowflake
                entity: climate.anbang_eeokeon
                show_name: false
                show_state: false
                styles:
                  card:
                    - background: none
                    - box-shadow: none
                    - width: 32px
                    - height: 32px
                    - padding: '0'
                card_mod:
                  style: |
                    @keyframes ac-spin {
                      from { transform: rotate(0deg); }
                      to { transform: rotate(360deg); }
                    }
                    ha-icon, ha-state-icon, .icon {
                      --mdc-icon-size: 32px !important;
                      width: 32px !important;
                      height: 32px !important;
                      color: {{ '#4FC3F7' if not is_state('[[climate_entity]]', 'off') else 'var(--gray300)' }} !important;
                      animation: {{ 'ac-spin 1.6s linear infinite' if not is_state('[[climate_entity]]', 'off') else 'none' }} !important;
                      display: inline-block !important;
                      transform-origin: center;
                    }
              - type: custom:button-card
                icon: mdi:fan
                entity: fan.anbang_silringpaen
                show_name: false
                show_state: false
                styles:
                  card:
                    - background: none
                    - box-shadow: none
                    - width: 32px
                    - height: 32px
                    - padding: '0'
                card_mod:
                  style: |
                    @keyframes fan-spin {
                      from { transform: rotate(0deg); }
                      to { transform: rotate(360deg); }
                    }
                    ha-icon, ha-state-icon, .icon {
                      --mdc-icon-size: 32px !important;
                      width: 32px !important;
                      height: 32px !important;
                      color: {{ '#4CAF50' if is_state('[[fan_entity]]', 'on') else 'var(--gray300)' }} !important;
                      animation: {{ 'fan-spin 1.2s linear infinite' if is_state('[[fan_entity]]', 'on') else 'none' }} !important;
                      display: inline-block;
                      transform-origin: center;
                            }
    grid_options:
      columns: 12
      rows: auto
  room_switch_panel:
    card:
      type: custom:button-card
      name: '[[title]]'
      icon: '[[room_icon]]'
      custom_fields:
        switches: |
          [[[
            const raw = [
              { entity: '[[b1_entity]]', name: '[[b1_name]]' },
              { entity: '[[b2_entity]]', name: '[[b2_name]]' },
              { entity: '[[b3_entity]]', name: '[[b3_name]]' },
              { entity: '[[b4_entity]]', name: '[[b4_name]]' },
              { entity: '[[b5_entity]]', name: '[[b5_name]]' },
              { entity: '[[b6_entity]]', name: '[[b6_name]]' },
            ].filter(b => b.entity !== 'none');

            const cols = raw.length > 4 ? 2 : 1;
            const perCol = Math.ceil(raw.length / cols);
            const columns = [];
            for (let c = 0; c < cols; c++) {
              columns.push(raw.slice(c * perCol, c * perCol + perCol));
            }
            const h = '[[button_height]]';

            const renderCol = (col, colIndex) => {
              const leftBorder = colIndex === 0 ? '2px' : '0px';
              const rightBorder = (colIndex === cols - 1) ? '2px' : '1px';
              return col.map((b, i) => {
                const on = states[b.entity]?.state === 'on';
                const topBorder = i === 0 ? '2px' : '0px';
                const bottomBorder = i === col.length - 1 ? '2px' : '1px';
                const domain = b.entity.split('.')[0];
                return `<div onclick="event.stopPropagation(); hass.callService('${domain}','toggle',{entity_id:'${b.entity}'})" style="width:60px;height:${h};box-sizing:border-box;display:flex;align-items:center;justify-content:center;cursor:pointer;background:${on ? 'var(--active-small)' : 'white'};border-top:${topBorder} solid black;border-bottom:${bottomBorder} solid black;border-left:${leftBorder} solid black;border-right:${rightBorder} solid black;font-size:10px;font-weight:600;color:black;text-align:center;line-height:1;">${b.name}</div>`;
              }).join('');
            };

            return `<div style="display:flex;">${columns.map((col, idx) => `<div style="display:flex;flex-direction:column;">${renderCol(col, idx)}</div>`).join('')}</div>`;
          ]]]
      styles:
        grid:
          - grid-template-areas: '"n switches" "i switches"'
          - grid-template-columns: 1fr min-content
          - grid-template-rows: min-content 1fr
        card:
          - padding: 22px
          - height: 200px
          - background-color: var(--gray100)
          - box-shadow: '8px 8px 16px var(--gray300), -8px -8px 16px #ffffff'
          - border: 1px solid rgba(255,255,255,0.1)
        custom_fields:
          switches:
            - justify-content: end
            - align-self: center
        name:
          - justify-self: start
          - align-self: start
          - font-size: 18px
          - font-weight: 500
          - color: black
        img_cell:
          - justify-content: start
          - position: absolute
          - width: 110px
          - height: 110px
          - left: 30px
          - bottom: -20px
          - margin: 0 0 0 -44px
          - background: '[[circle_bg]]'
          - border-radius: 500px
        icon:
          - position: relative
          - width: 50px
          - color: '[[icon_color]]'
          - opacity: '1'
      grid_options:
        columns: 12
        rows: auto
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_menubutton: true
    ignore_entity_settings: true
  entity_settings:
    - entity:
        input_boolean.kiosk_mode: 'on'
      hide_header: true
    - entity:
        input_boolean.kiosk_mode: 'off'
      hide_header: false
views:
  - title: 메인
    sections:
      - type: grid
        cards:
          - type: custom:layout-card
            layout_type: custom:grid-layout
            cards:
              - type: custom:button-card
                name: |
                  [[[
                    const now = new Date();
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const month = now.getMonth() + 1;
                    const date = now.getDate();
                    const dayName = days[now.getDay()];
                    return `${month}월 ${date}일, ${dayName}`;
                  ]]]
                label: |
                  [[[
                    return new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit' });
                  ]]]
                show_label: true
                styles:
                  grid:
                    - grid-template-areas: '"n" "l"'
                  card:
                    - background: none
                    - overflow: visible
                    - border: none
                    - box-shadow: none
                  name:
                    - justify-self: start
                    - font-size: 14px
                    - margin-top: 2px
                  label:
                    - justify-self: start
                    - font-size: 26px
                    - font-weight: 700
                    - margin-top: -2px
              - type: custom:button-card
                tap_action:
                  action: navigate
                  navigation_path: '#weather'
                  haptic: medium
                name: "[[[\n  const st = states['weather.forecast_home']?.state;\n\
                  \  if (!st || st === 'unknown' || st === 'unavailable') return '—';\n\
                  \  \n  const krMap = {\n    'clear-night': '맑은 밤',\n    'cloudy':\
                  \ '흐림',\n    'exceptional': '일기경보',\n    'fog': '안개',\n    'hail':\
                  \ '우박',\n    'lightning': '번개',\n    'lightning-rainy': '뇌우',\n\
                  \    'partlycloudy': '구름 많음',\n    'mostly-cloudy': '구름 많음',\n \
                  \   'partly-cloudy': '구름 많음',\n    'pouring': '폭우',\n    'rainy':\
                  \ '비',\n    'snowy': '눈',\n    'snowy-rainy': '진눈깨비',\n    'sunny':\
                  \ '맑음',\n    'windy': '바람',\n    'windy-variant': '바람'\n  };\n \
                  \ return krMap[st] || st;\n]]]\n"
                label: |
                  [[[
                    const w = states['weather.forecast_home'];
                    const a = w?.attributes || {};
                    const t = a.temperature ?? a.current_temperature ?? a.temp;
                    const numT = parseFloat(t);
                    if (!isNaN(numT) && isFinite(numT)) {
                      return `${Math.round(numT)}<span style="font-size:0.6cm;">°C</span>`;
                    }
                    return '—';
                  ]]]
                show_label: true
                custom_fields:
                  icon: |
                    [[[
                      let st = states['weather.forecast_home']?.state || 'unknown';
                      st = (st + '').toLowerCase().trim().replace(/\s+/g,'-').replace(/_/g,'-');
                      const map = {
                        'partly-cloudy': 'partlycloudy',
                        'mostly-cloudy': 'partlycloudy',
                        'mostlycloudy':  'partlycloudy',
                        'overcast':      'cloudy',
                        'clear-night':   'clear-night',
                        'sunny':         'sunny',
                        'clear':         'sunny'
                      };
                      const bad = ['unknown','unavailable','none','','—'];
                      const key = map[st] || st;
                      if (bad.includes(st)) {
                        return `<ha-icon icon="mdi:weather-cloudy" style="width:42px;height:42px;opacity:.7"></ha-icon>`;
                      }
                      return `<img src="/local/images/weather_icons/animated2/${key}.svg" width="54" height="54"
                                  onerror="this.outerHTML='<ha-icon icon=&quot;mdi:weather-cloudy&quot; style=&quot;width:42px;height:42px;opacity:.7&quot;></ha-icon>'">`;
                    ]]]
                styles:
                  grid:
                    - grid-template-areas: '"icon n" "icon l"'
                  card:
                    - overflow: visible
                    - background: none
                    - padding-right: 8px
                    - border: none
                    - box-shadow: none
                  name:
                    - justify-self: end
                    - font-size: 14px
                    - margin-top: 2px
                  label:
                    - justify-self: end
                    - font-size: 26px
                    - font-weight: 700
                    - margin-top: -2px
                  custom_fields:
                    icon:
                      - justify-self: end
                      - align-self: end
                      - padding-right: 10px
                      - transform: translateY(6px)
            layout:
              grid-template-columns: 50% auto
              grid-template-rows: 85px
          - type: custom:mod-card
            card_mod:
              style: |
                @media (min-width:180px) {
                  ha-card {
                    z-index: 99;
                    position: fixed;
                    bottom: 10px;
                    left: 10px;
                    width: calc(100% - 20px);
                    background: var(--active-big);
                    border-radius: 100px;
                    padding: 10px;
                    box-shadow: 8px 8px 16px rgba(0,0,0,0.6), -8px -8px 16px rgba(100,100,100,0.4);
                    border: 1px solid rgba(50,50,50,0.5);
