decluttering_templates:
  light_slider:
    card:
      type: custom:button-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      tap_action:
        action: toggle
        haptic: medium
      show_state: false
      styles:
        grid:
          - grid-template-columns: 40px 1fr
          - grid-template-areas: '"i n"'
        card:
          - padding: 10px 14px
          - height: 50px
          - border-radius: 12px
          - background: white
          - border: 1.5px solid black
          - transition: background 0.2s ease
        img_cell:
          - width: 32px
          - height: 32px
          - border-radius: 50%
          - background: rgba(0, 0, 0, 0.05)
        icon:
          - width: 18px
          - color: black
        name:
          - justify-self: start
          - font-size: 14px
          - font-weight: 600
          - color: black
      state:
        - value: 'on'
          styles:
            card:
              - background: var(--active-small)
            icon:
              - color: var(--orange)
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_menubutton: true
    ignore_entity_settings: true
  entity_settings:
    - entity:
        input_boolean.kiosk_mode: 'on'
      hide_header: true
    - entity:
        input_boolean.kiosk_mode: 'off'
      hide_header: false
views:
  - title: 메인
    sections:
      - type: grid
        cards:
          - type: custom:layout-card
            layout_type: custom:grid-layout
            cards:
              - type: custom:button-card
                tap_action:
                  action: navigate
                  navigation_path: '#clock'
                  haptic: medium
                name: |
                  [[[
                    const now = new Date();
                    const days = ['일', '월', '화', '수', '목', '금', '토'];
                    const month = now.getMonth() + 1;
                    const date = now.getDate();
                    const dayName = days[now.getDay()];
                    return `${month}월 ${date}일, ${dayName}`;
                  ]]]
                label: |
                  [[[
                    return new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit' });
                  ]]]
                show_label: true
                styles:
                  grid:
                    - grid-template-areas: '"n" "l"'
                  card:
                    - background: none
                    - overflow: visible
                    - border: none
                    - box-shadow: none
                  name:
                    - justify-self: start
                    - font-size: 14px
                    - margin-top: 2px
                  label:
                    - justify-self: start
                    - font-size: 26px
                    - font-weight: 700
                    - margin-top: -2px
              - type: custom:button-card
                tap_action:
                  action: navigate
                  navigation_path: '#weather'
                  haptic: medium
                name: |
                  [[[
                    const st = states['weather.forecast_home']?.state;
                    if (!st || st === 'unknown' || st === 'unavailable') return '—';
                    
                    const krMap = {
                      'clear-night': '맑은 밤',
                      'cloudy': '흐림',
                      'exceptional': '일기경보',
                      'fog': '안개',
                      'hail': '우박',
                      'lightning': '번개',
                      'lightning-rainy': '뇌우',
                      'partlycloudy': '구름 많음',
                      'mostly-cloudy': '구름 많음',
                      'partly-cloudy': '구름 많음',
                      'pouring': '폭우',
                      'rainy': '비',
                      'snowy': '눈',
                      'snowy-rainy': '진눈깨비',
                      'sunny': '맑음',
                      'windy': '바람',
                      'windy-variant': '바람'
                    };
                    return krMap[st] || st;
                  ]]]
                label: |
                  [[[
                    const w = states['weather.forecast_home'];
                    const a = w?.attributes || {};
                    const t = a.temperature ?? a.current_temperature ?? a.temp;
                    const numT = parseFloat(t);
                    if (!isNaN(numT) && isFinite(numT)) {
                      return `${Math.round(numT)}<span style="font-size:0.6cm;">°C</span>`;
                    }
                    return '—';
                  ]]]
                show_label: true
                custom_fields:
                  icon: |
                    [[[
                      let st = states['weather.forecast_home']?.state || 'unknown';
                      st = (st + '').toLowerCase().trim().replace(/\s+/g,'-').replace(/_/g,'-');
                      const map = {
                        'partly-cloudy': 'partlycloudy',
                        'mostly-cloudy': 'partlycloudy',
                        'mostlycloudy':  'partlycloudy',
                        'overcast':      'cloudy',
                        'clear-night':   'clear-night',
                        'sunny':         'sunny',
                        'clear':         'sunny'
                      };
                      const bad = ['unknown','unavailable','none','','—'];
                      const key = map[st] || st;
                      if (bad.includes(st)) {
                        return `<ha-icon icon="mdi:weather-cloudy" style="width:42px;height:42px;opacity:.7"></ha-icon>`;
                      }
                      return `<img src="/local/images/weather_icons/animated2/${key}.svg" width="54" height="54"
                                  onerror="this.outerHTML='<ha-icon icon=&quot;mdi:weather-cloudy&quot; style=&quot;width:42px;height:42px;opacity:.7&quot;></ha-icon>'">`;
                    ]]]
                styles:
                  grid:
                    - grid-template-areas: '"icon n" "icon l"'
                  card:
                    - overflow: visible
                    - background: none
                    - padding-right: 8px
                    - border: none
                    - box-shadow: none
                  name:
                    - justify-self: end
                    - font-size: 14px
                    - margin-top: 2px
                  label:
                    - justify-self: end
                    - font-size: 26px
                    - font-weight: 700
                    - margin-top: -2px
                  custom_fields:
                    icon:
                      - justify-self: end
                      - align-self: end
                      - padding-right: 10px
                      - transform: translateY(6px)
            layout:
              grid-template-columns: 50% auto
              grid-template-rows: 85px
          - type: custom:mod-card
            card_mod:
              style: |
                @media (min-width:180px) {
                  ha-card {
                    z-index: 99;
