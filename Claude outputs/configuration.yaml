# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# 1. 상태를 기록할 가상 헬퍼
input_boolean:
  geosil_ceiling_fan_state:
    name: "가상 실링팬 전원"
  anbang_ceiling_fan_state:
    name: "안방 실링팬 전원"
  studyroom_sove_fan_state:
    name: "서재 SOVE 실링팬 전원"
  nakyungroom_ceiling_fan_state:
    name: "나경방 실링팬 전원"
  studyroom_ceiling_fan_state:
    name: "공부방 실링팬 전원"
  cafe_ceiling_fan_state:
    name: "cafe 실링팬 전원"

input_number:
  virtual_ac_temp_livingroom:
    name: "가상 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_masterroom:
    name: "가상 안방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_nakyungroom:
    name: "가상 나경방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_kitchen:
    name: "가상 주방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_dressroom:
    name: "가상 드레스룸 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_studyroom:
    name: "가상 공부방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_jiharoom:
    name: "가상 지하방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_junhoroom:
    name: "가상 준호방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_cafe:
    name: "가상 cafe 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ceiling_fan_speed:
    name: "가상 실링팬 속도"
    initial: 33
    min: 0
    max: 100
    step: 1

  # 아래 2개는 기존 거실/안방 실링팬 템플릿이 참조하고 있었지만 정의가 빠져있던
  # 항목입니다 (그래서 지금까지 두 실링팬의 속도 조절이 항상 0으로 표시되고
  # 실제로 동작하지 않았어요). 이번에 같이 추가해서 정상 동작하도록 고쳤습니다.
  geosil_ceiling_fan_speed:
    name: "가상 거실 실링팬 속도"
    initial: 33
    min: 0
    max: 100
    step: 1

  anbang_ceiling_fan_speed:
    name: "가상 안방 실링팬 속도"
    initial: 33
    min: 0
    max: 100
    step: 1

  nakyungroom_ceiling_fan_speed:
    name: "가상 나경방 실링팬 속도"
    initial: 33
    min: 0
    max: 100
    step: 1

  studyroom_ceiling_fan_speed:
    name: "가상 공부방 실링팬 속도"
    initial: 33
    min: 0
    max: 100
    step: 1

  cafe_ceiling_fan_speed:
    name: "가상 cafe 실링팬 속도"
    initial: 33
    min: 0
    max: 100
    step: 1

  studyroom_sove_fan_speed:
    name: "서재 SOVE 실링팬 속도"
    min: 0
    max: 100
    step: 1
    initial: 0

  virtual_vacuum_battery:
    name: 가상 청소기 배터리
    min: 0
    max: 100
    step: 1
    initial: 100
    unit_of_measurement: "%"
    icon: mdi:battery

