template:
  - fan:
      - name: "서재 실링팬"
        unique_id: studyroom_sove_fan
        state: "{{ states('input_boolean.studyroom_sove_fan_state') }}"
        percentage: >
          {{ states('input_number.studyroom_sove_fan_speed') | int(0)
             if is_state('input_boolean.studyroom_sove_fan_state', 'on') else 0 }}
        speed_count: 6

        turn_on:
          - action: mqtt.publish
            data:
              topic: "cmnd/sonoff_rf_bridge/Backlog"
              # TODO: Portisch B0 전원(토글) RF 코드로 교체
              payload: "RfRaw TBD_STUDY_POWER_TOGGLE; RfRaw 0"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.studyroom_sove_fan_state

        turn_off:
          - action: mqtt.publish
            data:
              topic: "cmnd/sonoff_rf_bridge/Backlog"
              # TODO: Portisch B0 전원(토글) RF 코드로 교체
              payload: "RfRaw TBD_STUDY_POWER_TOGGLE; RfRaw 0"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.studyroom_sove_fan_state
          - action: input_number.set_value
            target:
              entity_id: input_number.studyroom_sove_fan_speed
            data:
              value: 0

        set_percentage:
          - choose:
              - conditions: "{{ percentage == 0 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "cmnd/sonoff_rf_bridge/Backlog"
                      payload: "RfRaw TBD_STUDY_POWER_TOGGLE; RfRaw 0"
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.studyroom_sove_fan_state

              - conditions: "{{ percentage <= 17 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "cmnd/sonoff_rf_bridge/Backlog"
                      payload: "RfRaw TBD_STUDY_SPEED_1; RfRaw 0"

              - conditions: "{{ percentage <= 34 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "cmnd/sonoff_rf_bridge/Backlog"
                      payload: "RfRaw TBD_STUDY_SPEED_2; RfRaw 0"

              - conditions: "{{ percentage <= 50 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "cmnd/sonoff_rf_bridge/Backlog"
                      payload: "RfRaw TBD_STUDY_SPEED_3; RfRaw 0"

              - conditions: "{{ percentage <= 67 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "cmnd/sonoff_rf_bridge/Backlog"
                      payload: "RfRaw TBD_STUDY_SPEED_4; RfRaw 0"

              - conditions: "{{ percentage <= 84 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "cmnd/sonoff_rf_bridge/Backlog"
                      payload: "RfRaw TBD_STUDY_SPEED_5; RfRaw 0"

              - conditions: "{{ percentage > 84 }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "cmnd/sonoff_rf_bridge/Backlog"
                      payload: "RfRaw TBD_STUDY_SPEED_6; RfRaw 0"

          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.studyroom_sove_fan_state
          - action: input_number.set_value
            target:
              entity_id: input_number.studyroom_sove_fan_speed
            data:
              value: "{{ percentage }}"

      - name: "거실 실링팬"
        state: "{{ states('input_boolean.geosil_ceiling_fan_state') }}"
        percentage: "{{ states('input_number.geosil_ceiling_fan_speed') | int(0) }}"
        speed_count: 6

        # 전원 켜기 동작
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.geosil_ceiling_fan_state

        # 전원 끄기 동작
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.geosil_ceiling_fan_state

        # 바람 세기(속도) 조절 동작
        set_percentage:
          - action: input_number.set_value
            target:
              entity_id: input_number.geosil_ceiling_fan_speed
            data:
              value: "{{ percentage }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.geosil_ceiling_fan_state

      - name: "안방 실링팬"
        state: "{{ states('input_boolean.anbang_ceiling_fan_state') }}"
        percentage: "{{ states('input_number.anbang_ceiling_fan_speed') | int(0) }}"
        speed_count: 6

        # 전원 켜기 동작
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.anbang_ceiling_fan_state

        # 전원 끄기 동작
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.anbang_ceiling_fan_state

        # 바람 세기(속도) 조절 동작
        set_percentage:
          - action: input_number.set_value
            target:
              entity_id: input_number.anbang_ceiling_fan_speed
            data:
              value: "{{ percentage }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.anbang_ceiling_fan_state

      - name: "나경방 실링팬"
        unique_id: nakyungroom_ceiling_fan
        state: "{{ states('input_boolean.nakyungroom_ceiling_fan_state') }}"
        percentage: "{{ states('input_number.nakyungroom_ceiling_fan_speed') | int(0) }}"
        speed_count: 6

        # 전원 켜기 동작
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.nakyungroom_ceiling_fan_state

        # 전원 끄기 동작
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.nakyungroom_ceiling_fan_state

        # 바람 세기(속도) 조절 동작
        set_percentage:
          - action: input_number.set_value
            target:
              entity_id: input_number.nakyungroom_ceiling_fan_speed
            data:
              value: "{{ percentage }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.nakyungroom_ceiling_fan_state

      - name: "공부방 실링팬"
        unique_id: studyroom_ceiling_fan
        state: "{{ states('input_boolean.studyroom_ceiling_fan_state') }}"
        percentage: "{{ states('input_number.studyroom_ceiling_fan_speed') | int(0) }}"
        speed_count: 6

        # 전원 켜기 동작
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.studyroom_ceiling_fan_state

        # 전원 끄기 동작
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.studyroom_ceiling_fan_state

        # 바람 세기(속도) 조절 동작
        set_percentage:
          - action: input_number.set_value
            target:
              entity_id: input_number.studyroom_ceiling_fan_speed
            data:
              value: "{{ percentage }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.studyroom_ceiling_fan_state

      - name: "cafe 실링팬"
        unique_id: cafe_ceiling_fan
        state: "{{ states('input_boolean.cafe_ceiling_fan_state') }}"
        percentage: "{{ states('input_number.cafe_ceiling_fan_speed') | int(0) }}"
        speed_count: 6

        # 전원 켜기 동작
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.cafe_ceiling_fan_state

        # 전원 끄기 동작
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.cafe_ceiling_fan_state

        # 바람 세기(속도) 조절 동작
        set_percentage:
          - action: input_number.set_value
            target:
              entity_id: input_number.cafe_ceiling_fan_speed
            data:
              value: "{{ percentage }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.cafe_ceiling_fan_state

  - sensor:
      - name: "vnd_krw_100"
        unit_of_measurement: "KRW"
        state: >
          {% set usd_krw = states('sensor.yahoofinance_usdkrw_x') | float(0) %}
          {% set usd_vnd = states('sensor.yahoofinance_vnd_x') | float(0) %}
          {% if usd_vnd > 0 %}
            {{ ((usd_krw / usd_vnd) * 100) | round(2) }}
          {% else %}
            0
          {% endif %}
      - name: "counts_lights"
        state: "{{ states.light | selectattr('state','eq','on') | list | count }}"
      - name: "door_status"
        state: "{% if is_state('binary_sensor.contact_sensor_door', 'on') %}열림{% else %}닫힘{% endif %}"
      - name: "water_status"
        state: "{% if is_state('binary_sensor.tuya_nususenseo_water_leak', 'on') %}감지됨{% else %}정상{% endif %}"
  - vacuum:
      - name: "Roborock S5E C2E7 Robot Cleaner"
        unique_id: roborock_s5e_c2e7_robot_cleaner
        state: "{{ states('input_select.virtual_vacuum_state') }}"
        fan_speed: "{{ states('input_select.virtual_vacuum_fan_speed') }}"
        fan_speeds:
          - Silent
          - Basic
          - Strong
          - Full Speed
        attributes:
          battery_level: "{{ states('input_number.virtual_vacuum_battery') | int(0) }}"
          vacuum.status_desc: >
            {% set s = states('input_select.virtual_vacuum_state') %}
            {% if s == 'docked' %}충전 완료
            {% elif s == 'cleaning' %}청소 중
            {% elif s == 'paused' %}일시 정지
            {% elif s == 'returning' %}복귀 중
            {% elif s == 'idle' %}대기 중
            {% elif s == 'error' %}오류 발생
            {% else %}알 수 없음
            {% endif %}
        start:
          - action: input_select.select_option
            target:
              entity_id: input_select.virtual_vacuum_state
            data:
              option: cleaning
        pause:
          - action: input_select.select_option
            target:
              entity_id: input_select.virtual_vacuum_state
            data:
              option: paused
        stop:
          - action: input_select.select_option
            target:
              entity_id: input_select.virtual_vacuum_state
            data:
              option: idle
        return_to_base:
          - action: input_select.select_option
            target:
              entity_id: input_select.virtual_vacuum_state
            data:
              option: returning
        set_fan_speed:
          - action: input_select.select_option
            target:
              entity_id: input_select.virtual_vacuum_fan_speed
            data:
              option: "{{ fan_speed }}"

mqtt:
  sensor:
    - name: Zigbee2MQTT Network Map
      state_topic: zigbee2mqtt/bridge/response/networkmap
      unique_id: zigbee2mqtt_networkmap
      value_template: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      json_attributes_topic: zigbee2mqtt/bridge/response/networkmap
      json_attributes_template: "{{ value_json.data.value | tojson }}"

recorder:
  exclude:
    entities:
      - sensor.zigbee2mqtt_network_map

yahoofinance:
  symbols:
    - AVGO
    - AAPL
    - NVDA
    - TSLA
    - USDKRW=X
    - EURKRW=X
    - JPYKRW=X
    - CNYKRW=X
    - VND=X
