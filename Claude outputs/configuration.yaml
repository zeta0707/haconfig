  virtual_vacuum_state:
    name: 가상 청소기 상태
    options:
      - docked
      - idle
      - cleaning
      - paused
      - returning
      - error
    initial: docked
    icon: mdi:robot-vacuum

  virtual_vacuum_fan_speed:
    name: 가상 청소기 팬속도
    options:
      - Silent
      - Basic
      - Strong
      - Full Speed
    initial: Basic
    icon: mdi:fan

climate:
  - platform: climate_template
    name: "거실 에어컨"
    unique_id: ac_livingroom
    modes:
      - "off"
      - cool
      - dry
      - fan_only
    min_temp: 16
    max_temp: 30
    current_temperature_template: "{{ states('sensor.temperature_sensor_temperature') }}"
    hvac_mode_template: "{{ states('input_select.virtual_ac_mode_livingroom') }}"
    target_temperature_template: "{{ states('input_number.virtual_ac_temp_livingroom') | float(24) }}"
    set_hvac_mode:
      - service: input_select.select_option
        target:
          entity_id: input_select.virtual_ac_mode_livingroom
        data:
          option: "{{ hvac_mode }}"
    set_temperature:
      - service: input_number.set_value
