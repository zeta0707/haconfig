    hvac_mode_template: "{{ states('input_select.virtual_ac_mode_jiharoom') }}"
    target_temperature_template: "{{ states('input_number.virtual_ac_temp_jiharoom') | float(24) }}"
    set_hvac_mode:
      - service: input_select.select_option
        target:
