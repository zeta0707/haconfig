# ==============================================================================
# 신원아파트 configuration.yaml 에 추가할 "가상 에어컨" 설정
# 대상: 나경방, 주방, 드레스룸, 공부방, 지하방, 준호방 (6개 방)
#
# 적용 방법:
#   기존 configuration.yaml 안의 같은 이름의 최상위 키(input_number:, input_select:,
#   climate:) 밑에 아래 항목들을 "추가"해 주세요. (키를 새로 만들지 말고 기존
#   input_number: / input_select: / climate: 블록에 들여쓰기를 맞춰서 이어붙이면 됩니다)
#
# 저장 후에는 채팅에서 알려주시면 template.reload 서비스를 호출해서(재부팅 없이)
# 바로 반영하겠습니다. (climate_template 플랫폼은 template.reload로 반영됩니다)
# ==============================================================================

# ------------------------------------------------------------------
# 1) input_number: 블록 안에 추가 (기존 virtual_ac_temp_livingroom / _masterroom 옆에)
# ------------------------------------------------------------------
input_number:
  virtual_ac_temp_nakyungroom:
    name: "가상 나경방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_kitchen:
    name: "가상 주방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_dressroom:
    name: "가상 드레스룸 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_studyroom:
    name: "가상 공부방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_jiharoom:
    name: "가상 지하방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

  virtual_ac_temp_junhoroom:
    name: "가상 준호방 에어컨 설정온도"
    initial: 24
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"

# ------------------------------------------------------------------
# 2) input_select: 블록 안에 추가 (기존 virtual_ac_mode_livingroom / _masterroom 옆에)
# ------------------------------------------------------------------
input_select:
  virtual_ac_mode_nakyungroom:
    name: "가상 나경방 에어컨 모드"
    options:
      - "off"
      - cool
      - dry
      - fan_only
    initial: "off"
    icon: mdi:air-conditioner

  virtual_ac_mode_kitchen:
    name: "가상 주방 에어컨 모드"
    options:
      - "off"
      - cool
      - dry
      - fan_only
    initial: "off"
    icon: mdi:air-conditioner

  virtual_ac_mode_dressroom:
    name: "가상 드레스룸 에어컨 모드"
    options:
      - "off"
      - cool
      - dry
      - fan_only
    initial: "off"
    icon: mdi:air-conditioner

  virtual_ac_mode_studyroom:
    name: "가상 공부방 에어컨 모드"
    options:
      - "off"
      - cool
      - dry
      - fan_only
    initial: "off"
    icon: mdi:air-conditioner

  virtual_ac_mode_jiharoom:
    name: "가상 지하방 에어컨 모드"
    options:
      - "off"
      - cool
      - dry
      - fan_only
    initial: "off"
    icon: mdi:air-conditioner

  virtual_ac_mode_junhoroom:
    name: "가상 준호방 에어컨 모드"
    options:
      - "off"
      - cool
      - dry
      - fan_only
    initial: "off"
    icon: mdi:air-conditioner

# ------------------------------------------------------------------
# 3) climate: 리스트 안에 추가 (기존 ac_livingroom / ac_masterroom 항목 옆에)
#    entity_id는 name의 한글을 HA가 자동으로 로마자 슬러그화해서 정해집니다.
#    (기존 규칙 확인: "안방 에어컨" -> climate.anbang_eeokeon,
#                     "거실 에어컨" -> climate.geosil_eeokeon)
#    -> 나경방 에어컨      -> climate.nagyeongbang_eeokeon
#    -> 주방 에어컨        -> climate.jubang_eeokeon
#    -> 드레스룸 에어컨    -> climate.deureseurum_eeokeon
#    -> 공부방 에어컨      -> climate.gongbubang_eeokeon
#    -> 지하방 에어컨      -> climate.jihabang_eeokeon
#    -> 준호방 에어컨      -> climate.junhobang_eeokeon
# ------------------------------------------------------------------
climate:
  - platform: climate_template
    name: "나경방 에어컨"
    unique_id: ac_nakyungroom
    modes:
      - "off"
      - cool
      - dry
      - fan_only
    min_temp: 16
    max_temp: 30
    current_temperature_template: "{{ states('sensor.temperature_sensor_temperature') }}"
    hvac_mode_template: "{{ states('input_select.virtual_ac_mode_nakyungroom') }}"
    target_temperature_template: "{{ states('input_number.virtual_ac_temp_nakyungroom') | float(24) }}"
    set_hvac_mode:
      - service: input_select.select_option
        target:
          entity_id: input_select.virtual_ac_mode_nakyungroom
        data:
          option: "{{ hvac_mode }}"
    set_temperature:
      - service: input_number.set_value
        target:
          entity_id: input_number.virtual_ac_temp_nakyungroom
        data:
          value: "{{ temperature }}"

  - platform: climate_template
    name: "주방 에어컨"
    unique_id: ac_kitchen
    modes:
      - "off"
      - cool
      - dry
      - fan_only
    min_temp: 16
    max_temp: 30
    current_temperature_template: "{{ states('sensor.temperature_sensor_temperature') }}"
    hvac_mode_template: "{{ states('input_select.virtual_ac_mode_kitchen') }}"
    target_temperature_template: "{{ states('input_number.virtual_ac_temp_kitchen') | float(24) }}"
    set_hvac_mode:
      - service: input_select.select_option
        target:
          entity_id: input_select.virtual_ac_mode_kitchen
        data:
          option: "{{ hvac_mode }}"
    set_temperature:
      - service: input_number.set_value
        target:
          entity_id: input_number.virtual_ac_temp_kitchen
        data:
          value: "{{ temperature }}"

  - platform: climate_template
    name: "드레스룸 에어컨"
    unique_id: ac_dressroom
    modes:
      - "off"
      - cool
      - dry
      - fan_only
    min_temp: 16
    max_temp: 30
    current_temperature_template: "{{ states('sensor.temperature_sensor_temperature') }}"
    hvac_mode_template: "{{ states('input_select.virtual_ac_mode_dressroom') }}"
    target_temperature_template: "{{ states('input_number.virtual_ac_temp_dressroom') | float(24) }}"
    set_hvac_mode:
      - service: input_select.select_option
        target:
          entity_id: input_select.virtual_ac_mode_dressroom
        data:
          option: "{{ hvac_mode }}"
    set_temperature:
      - service: input_number.set_value
        target:
          entity_id: input_number.virtual_ac_temp_dressroom
        data:
          value: "{{ temperature }}"

  - platform: climate_template
    name: "공부방 에어컨"
    unique_id: ac_studyroom
    modes:
      - "off"
      - cool
      - dry
      - fan_only
    min_temp: 16
    max_temp: 30
    current_temperature_template: "{{ states('sensor.temperature_sensor_temperature') }}"
    hvac_mode_template: "{{ states('input_select.virtual_ac_mode_studyroom') }}"
    target_temperature_template: "{{ states('input_number.virtual_ac_temp_studyroom') | float(24) }}"
    set_hvac_mode:
      - service: input_select.select_option
        target:
          entity_id: input_select.virtual_ac_mode_studyroom
        data:
          option: "{{ hvac_mode }}"
    set_temperature:
      - service: input_number.set_value
        target:
          entity_id: input_number.virtual_ac_temp_studyroom
        data:
          value: "{{ temperature }}"

  - platform: climate_template
    name: "지하방 에어컨"
    unique_id: ac_jiharoom
    modes:
      - "off"
